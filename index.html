<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>برنامج الألحان – مدرسة القديس بولس للشمامسة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&amp;display=swap">
<style>
:root{--bg:#faf3e3;--card:#ffffff;--ink:#241a14;--mute:#6a5a50;--fld:#fffaf0;--c:#8a1c2b;--ct:#8a1c2b;--on:#1f3b72;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#150f14;--card:#241a22;--ink:#f6ecd6;--mute:#d6c4c8;--fld:#1a1318;--c:#9b2335;--ct:#ffd37a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#150f14;--card:#241a22;--ink:#f6ecd6;--mute:#d6c4c8;--fld:#1a1318;--c:#9b2335;--ct:#ffd37a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg) 0,color-mix(in srgb,#f0c14b 26%,var(--bg)) 100%);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;line-height:1.5}
header{background:radial-gradient(circle at 50% 0%,#b8323f 0,#7a1620 42%,#1f3b72 100%);text-align:center;color:#fff;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 40px;border-radius:0 0 36px 36px;border-bottom:5px solid #f0c14b;box-shadow:0 8px 24px rgba(31,59,114,.35)}
header img{width:150px;height:150px;border-radius:50%;background:#fff;border:5px solid #f0c14b;box-shadow:0 0 0 7px rgba(255,255,255,.22),0 8px 20px rgba(0,0,0,.35)}
.sch{margin-top:14px;color:#ffe29a;font-weight:600;font-size:16px}
h1{margin:2px 0 0;font-size:38px;font-weight:800;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.sub{margin-top:6px;display:inline-block;padding:3px 16px;border-radius:99px;background:rgba(255,255,255,.18);font-size:14px}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:0 16px 28px}
#yrs,#ay,#gy{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:14px -8px 0;position:relative;padding:10px 8px;background:var(--card);border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#yrs button,#ay button,#gy button{width:100%;min-width:0;max-width:48px;aspect-ratio:1;margin:0 auto;padding:0;border-radius:50%;border:2px solid var(--ct);background:transparent;color:var(--ct);font-family:inherit;font-weight:800;font-size:19px;cursor:pointer;transition:transform .15s}
#yrs button[aria-selected="true"],#ay button[aria-selected="true"],#gy button[aria-selected="true"]{transform:scale(1.1);background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 0 0 3px #f0c14b,0 4px 10px rgba(0,0,0,.25)}
h2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px;padding:10px 18px;border-radius:14px;background:linear-gradient(90deg,var(--c),#1f3b72);color:#fff;font-size:24px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:-26px -8px 0;padding:6px;background:var(--card);border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative}
#nav button{min-height:46px;border:0;border-radius:16px;background:transparent;color:var(--ct);font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
#nav button[aria-selected="true"]{background:var(--c);color:#fff}
.pn{background:var(--card);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px}
.pn h3{margin:0;font-size:19px;color:var(--ct)}
.pn p{margin:0}
.pn input,.pn select,.pn textarea{font-family:inherit;font-size:16px;min-height:44px;padding:0 10px;border:2px solid var(--ct);border-radius:10px;background:var(--fld);color:var(--ink);max-width:100%}
.pn textarea{padding:8px 10px;min-height:80px;width:100%}
.pn .sm{width:84px;text-align:center}
.rw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.it{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--ct);padding:6px 0}
.bdg{padding:2px 12px;border-radius:99px;font-weight:600;color:#fff;font-size:14px}
.bdg.p{background:#15803d}.bdg.a{background:#b91c1c}.bdg.s{background:#1f3b72}
.sb{width:100%;min-height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:var(--fld);color:var(--ink);border:2px solid transparent;border-right:6px solid var(--c);border-radius:12px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer}
.sb[aria-current="true"]{border-color:var(--c)}
#am{margin:12px 0 0;padding:8px 14px;border-radius:10px;background:var(--card);color:var(--ink);border:2px solid var(--ct)}
#terms,.tt{display:grid;gap:8px;margin:0 0 12px}.tt{grid-template-columns:1fr 1fr;margin-top:14px}
#terms button,.tt button{min-height:46px;padding:6px;line-height:1.3;font-family:inherit;font-size:15px;font-weight:600;background:var(--card);color:var(--ct);border:2px solid var(--ct);border-radius:12px;cursor:pointer}
#terms button[aria-selected="true"],.tt button[aria-selected="true"]{background:var(--c);color:#fff;border-color:var(--c)}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#list button{width:100%;min-height:56px;text-align:right;display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--card);color:var(--ink);border:2px solid transparent;border-right:7px solid var(--c);border-radius:14px;font-family:inherit;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#list button[aria-current="true"]{border-color:var(--c);border-right-width:7px}
#list i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
h2 small{font-size:14px;font-weight:600;padding:2px 12px;border-radius:99px;background:rgba(255,255,255,.25)}
#empty::before{content:"\266A";display:block;font-size:46px;line-height:1.1;color:var(--ct)}
footer{text-align:center;background:#1f3b72;color:#ffe29a;border-top:4px solid #f0c14b;font-size:14px;font-weight:600;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(0,0,0,.15)}
#empty{padding:28px 20px;text-align:center;color:var(--mute);background:var(--card);border:2px dashed var(--c);border-radius:14px;font-size:17px}
#player{margin-top:16px;background:var(--card);border-radius:16px;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);overflow:hidden}
#pt{margin:0 -16px;padding:12px 16px;background:linear-gradient(90deg,var(--c),#1f3b72);color:#fff;font-size:21px;font-weight:800}
audio{width:100%;height:44px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--mute)}
.fld input{width:96px;height:48px;font-family:inherit;font-weight:600;font-size:18px;text-align:center;border:2px solid var(--c);border-radius:10px;background:var(--fld);color:var(--ink)}
.btn{min-height:48px;padding:0 18px;font-family:inherit;font-size:15px;font-weight:600;background:var(--c);color:#fff;border:2px solid var(--c);border-radius:12px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn.gp{background:#15803d;border-color:#15803d;color:#fff}.btn.rd{background:#b91c1c;border-color:#b91c1c;color:#fff}
.btn.on{background:var(--on);border-color:var(--on);color:#fff}
#st{margin:0;font-size:14px;color:var(--mute);min-height:21px}
button:focus-visible,input:focus-visible{outline:3px solid #f0a000;outline-offset:2px}
</style>
</head>

function tabs(box,items,sel,fn){

  tabs($('terms'),YEARS[yi].t.map(x=>({label:x.n})),ti,i=>{ti=i;hi=0;show()});
  const nt=YEARS[yi].t.length;$('terms').style.gridTemplateColumns='repeat('+(nt<=3?nt:2)+',minmax(0,1fr))';
  const yt=$('yt'),nh=T().h.length;
  yt.textContent=YEARS[yi].n;
  const k=document.createElement('small');
  k.textContent=nh===0?'لسه فاضي':nh===1?'لحن واحد':nh+' ألحان';
  yt.appendChild(k);
  const has=nh>0;
  $('empty').hidden=has;$('player').hidden=!has;$('list').hidden=!has;
  if(has){pick(hi)}else{au.pause();au.removeAttribute('src');drawList()}
}
const cur=()=>Math.round(au.currentTime);
$('ga').onclick=()=>{$('la').value=cur();say('')};
$('gb').onclick=()=>{$('lb').value=cur();say('')};
$('lp').onclick=()=>{
  if(loop){loop=false;$('lp').textContent='تشغيل التكرار';$('lp').classList.remove('on');say('');return}
  const a=parseFloat($('la').value),b=parseFloat($('lb').value);
  if(!(a>=0)||!(b>a)){say('لازم تكتب البداية والنهاية، والنهاية تكون أكبر من البداية');return}
  loop=true;$('lp').textContent='إيقاف التكرار';$('lp').classList.add('on');
  say('التكرار شغّال: من '+fmt(a)+' لحد '+fmt(b));
  au.currentTime=a;au.play();
};
setInterval(()=>{
  if(!loop)return;
  const a=parseFloat($('la').value),b=parseFloat($('lb').value);
  if(!(b>a))return;
  if(!au.paused&&au.currentTime>=b){au.currentTime=a}
  else if(au.ended){au.currentTime=a;au.play()}
},80);
$('dl').onclick=async()=>{
  const h=T().h[hi];
  try{
    let d=null;
    try{d=window.claude?await window.claude.use('downloads'):null}catch(_){d=null}
    const buf=await (await fetch(h.s)).arrayBuffer();
    if(d){await d.save({filename:h.f,data:buf})}
    else{
      const u=URL.createObjectURL(new Blob([buf],{type:'audio/mp4'}));
      const a=document.createElement('a');a.href=u;a.download=h.f;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),5000);
    }
    say('تم التحميل');
  }catch(e){say(e&&e.code==='declined'?'':'مقدرتش أحمّل اللحن')}
};
show();
/* ---------- الحضور والغياب ---------- */
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){const v=a[x];if(x==='class')e.className=v;else if(x.startsWith('on'))e[x]=v;else e.setAttribute(x,v)}e.append(...k);return e};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const btn=(txt,fn,cls)=>el('button',{type:'button',class:'btn '+(cls||''),onclick:fn},txt);
const DEF={7:['ماركو','مينا','مايكل','كيرمينا','كيرلس ابراهيم','بيشوي عدلي']};
let DBA={students:{},rec:{}};
try{const x=JSON.parse(localStorage.getItem('att1')||'null');if(x&&x.students&&x.rec)DBA=x}catch(_){}
for(let y=1;y<=7;y++){if(!Array.isArray(DBA.students[y]))DBA.students[y]=(DEF[y]||[]).slice()}
const persist=()=>{try{localStorage.setItem('att1',JSON.stringify(DBA))}catch(_){}};
let VIEW='h',AY=7,AT='class',AD=today();
const rk=()=>AY+'|'+AT;
const dayRec=()=>((DBA.rec[rk()]||{})[AD]||{});
function mark(n,v){
  const k=rk();DBA.rec[k]=DBA.rec[k]||{};DBA.rec[k][AD]=DBA.rec[k][AD]||{};
  if(DBA.rec[k][AD][n]===v)delete DBA.rec[k][AD][n];else DBA.rec[k][AD][n]=v;
  persist();renderA();
}
function stats(n){
  let p=0,t=0;const r=DBA.rec[rk()]||{};
  for(const d in r){const v=r[d][n];if(v){t++;if(v==='p')p++}}
  return[p,t];
}
function setView(v){
  VIEW=v;$('hv').hidden=v!=='h';$('av').hidden=v!=='a';$('gv').hidden=v!=='g';
  ['h','a','g'].forEach((k,i)=>$('nv'+(i+1)).setAttribute('aria-selected',String(v===k)));
  if(v==='a')renderA();
  if(v==='g')renderG();
}
$('nv1').onclick=()=>setView('h');
$('nv2').onclick=()=>setView('a');
$('nv3').onclick=()=>setView('g');
function renderA(){
  if(VIEW!=='a')return;
  const y0=window.scrollY,box=$('av');box.textContent='';
  const ay=el('div',{id:'ay',role:'tablist','aria-label':'السنوات'});
  tabs(ay,[1,2,3,4,5,6,7].map(i=>({label:i,aria:'السنة '+i})),AY-1,i=>{AY=i+1;renderA()});
  box.append(ay);
  const tt=el('div',{class:'tt'});
  tabs(tt,[{label:'حضور حصة'},{label:'حضور قداس'}],AT==='class'?0:1,i=>{AT=i?'mass':'class';renderA()});
  const names=DBA.students[AY],dr=dayRec();
  const dt=el('input',{type:'date','aria-label':'التاريخ',value:AD});
  dt.onchange=()=>{if(dt.value){AD=dt.value;renderA()}};
  const np=names.filter(n=>dr[n]==='p').length,na=names.filter(n=>dr[n]==='a').length;
  const p=el('div',{class:'pn'},
    el('h3',{},'السنة '+AY+' · '+(AT==='class'?'حضور حصة':'حضور قداس')),
    el('div',{class:'rw'},el('span',{},'التاريخ:'),dt),
    el('p',{},'حاضر: '+np+' · غايب: '+na+' · من '+names.length));
  if(!names.length)p.append(el('p',{},'لسه مفيش أسماء في السنة دي. ضيف الأسماء من تحت.'));
  names.forEach((n,i)=>{
    const v=dr[n],[sp,st]=stats(n);
    let sure=false;
    const del=btn('مسح',()=>{
      if(!sure){sure=true;del.textContent='تأكيد المسح';return}
      DBA.students[AY].splice(i,1);persist();renderA();
    },'alt');
    del.setAttribute('aria-label','مسح '+n);
    p.append(el('div',{class:'it'},
      el('span',{},el('b',{},n),el('br'),el('small',{},st?('حضر '+sp+' من '+st):'لسه مفيش تسجيل')),
      el('span',{class:'rw'},
        btn('حاضر',()=>mark(n,'p'),v==='p'?'gp':'alt'),
        btn('غايب',()=>mark(n,'a'),v==='a'?'rd':'alt'),
        del)));
  });
  const ni=el('input',{type:'text',placeholder:'اسم طالب جديد','aria-label':'اسم طالب جديد'});
  const add=()=>{const s=ni.value.trim();if(!s||names.includes(s))return;DBA.students[AY].push(s);persist();renderA()};
  ni.onkeydown=e=>{if(e.key==='Enter')add()};
  const pa=el('div',{class:'pn'},el('h3',{},'إضافة طالب'),el('div',{class:'rw'},ni,btn('إضافة',add)),
    el('small',{},'الأسماء والحضور بيتحفظوا على الجهاز ده بس'));
  box.append(tt,p,pa);
  window.scrollTo(0,y0);
}

/* ---------- الدرجات ---------- */
let GR={ex:{},sc:{}};
try{const x=JSON.parse(localStorage.getItem('gr1')||'null');if(x&&x.ex&&x.sc)GR=x}catch(_){}
const gpersist=()=>{try{localStorage.setItem('gr1',JSON.stringify(GR))}catch(_){}};
let GY=7,GX=0;
const exs=()=>GR.ex[GY]||(GR.ex[GY]=[]);
const skey=(e,n)=>GY+'|'+e.id+'|'+n;
function gtxt(n){
  let s=0,m=0;
  exs().forEach(e=>{const v=GR.sc[skey(e,n)];if(typeof v==='number'){s+=v;m+=e.m}});
  return m?('المجموع: '+s+' من '+m+' ('+Math.round(s/m*100)+'٪)'):'لسه مفيش درجات';
}
function renderG(){
  if(VIEW!=='g')return;
  const y0=window.scrollY,box=$('gv');box.textContent='';
  const gy=el('div',{id:'gy',role:'tablist','aria-label':'السنوات'});
  tabs(gy,[1,2,3,4,5,6,7].map(i=>({label:i,aria:'السنة '+i})),GY-1,i=>{GY=i+1;GX=0;renderG()});
  box.append(gy);
  const list=exs();
  if(GX>=list.length)GX=0;
  if(list.length){
    const tt=el('div',{class:'tt'});
    tabs(tt,list.map(e=>({label:e.t})),GX,i=>{GX=i;renderG()});
    box.append(tt);
    const e=list[GX],names=DBA.students[GY]||[];
    const p=el('div',{class:'pn'},el('h3',{},e.t+' (من '+e.m+')'));
    if(!names.length)p.append(el('p',{},'لسه مفيش أسماء في السنة دي. ضيف الأسماء من صفحة الحضور.'));
    names.forEach(n=>{
      const v=GR.sc[skey(e,n)];
      const sm=el('small',{},gtxt(n));
      const inp=el('input',{type:'number',class:'sm',inputmode:'decimal',step:'0.5','aria-label':'درجة '+n,value:typeof v==='number'?String(v):''});
      inp.onchange=()=>{
        const k=skey(e,n);
        if(inp.value==='')delete GR.sc[k];else GR.sc[k]=+inp.value;
        gpersist();sm.textContent=gtxt(n);
      };
      p.append(el('div',{class:'it'},el('span',{},el('b',{},n),el('br'),sm),inp));
    });
    let sure=false;
    const del=btn('مسح الامتحان ده',()=>{
      if(!sure){sure=true;del.textContent='اضغط تاني للتأكيد';return}
      const pre=GY+'|'+e.id+'|';
      Object.keys(GR.sc).forEach(k=>{if(k.startsWith(pre))delete GR.sc[k]});
      list.splice(GX,1);GX=0;gpersist();renderG();
    },'alt');
    p.append(del);
    box.append(p);
  }else{
    box.append(el('div',{class:'pn'},el('p',{},'لسه مفيش امتحانات في السنة دي. ضيف أول امتحان من تحت.')));
  }
  const nt=el('input',{type:'text',placeholder:'اسم الامتحان','aria-label':'اسم الامتحان'});
  const nmx=el('input',{type:'number',class:'sm',value:'100','aria-label':'الدرجة النهائية'});
  const add=()=>{
    const t=nt.value.trim();if(!t)return;
    list.push({id:Date.now().toString(36),t,m:+nmx.value||100});
    GX=list.length-1;gpersist();renderG();
  };
  nt.onkeydown=ev=>{if(ev.key==='Enter')add()};
  box.append(el('div',{class:'pn'},el('h3',{},'إضافة امتحان'),
    el('div',{class:'rw'},nt,nmx,btn('إضافة',add)),
    el('small',{},'الدرجات بتتحفظ على الجهاز ده بس')));
  window.scrollTo(0,y0);
}
</script>
</body>
</html>
